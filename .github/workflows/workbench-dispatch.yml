name: Workbench dispatcher

# This is the ONLY edition file also installed on the fork's default main.
# GitHub runs scheduled workflows from the default branch, not an edition branch.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Synchronize source or build independent installers'
        type: choice
        options: [sync, build]
        default: sync

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'yuansui486/nuphus-contrib' && (github.event_name == 'schedule' || inputs.task == 'sync')
    uses: yuansui486/nuphus-contrib/.github/workflows/workbench-sync.yml@edition/workflow-workbench
  build:
    if: github.repository == 'yuansui486/nuphus-contrib' && github.event_name == 'workflow_dispatch' && inputs.task == 'build'
    uses: yuansui486/nuphus-contrib/.github/workflows/workbench-release.yml@edition/workflow-workbench
