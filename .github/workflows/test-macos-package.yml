name: Test macOS package

on:
  push:
    branches:
      - test/macos-permission-package
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-macos-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build macOS arm64 package
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          cd frontend
          npm ci

      - name: Build application bundle
        run: >-
          npx tauri build --verbose --bundles app
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Ad-hoc sign application
        run: |
          APP_PATH="target/release/bundle/macos/Nuphus.app"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

      - name: Create test packages
        run: |
          APP_PATH="target/release/bundle/macos/Nuphus.app"
          STAGING_DIR="$(mktemp -d)"
          cp -R "$APP_PATH" "$STAGING_DIR/Nuphus.app"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create \
            -volname "Nuphus" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "nuphus-macos-arm64-permission-test.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "nuphus-macos-arm64-permission-test.app.zip"

      - name: Upload test packages
        uses: actions/upload-artifact@v4
        with:
          name: nuphus-macos-arm64-permission-test
          if-no-files-found: error
          retention-days: 14
          path: |
            nuphus-macos-arm64-permission-test.dmg
            nuphus-macos-arm64-permission-test.app.zip
