name: Workbench CI

on:
  push:
    branches: [edition/lingque]
  pull_request:
    branches: [edition/lingque]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

env:
  NUPHUS_BUILD_SKIP_MODELS: "1"

jobs:
  frontend:
    name: Workbench frontend and original editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify exact candidate revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.ref || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Validated source revision: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: tools/lingque-release
      - run: npm test
        working-directory: tools/lingque-release
      - run: node tools/lingque-release/check-version.mjs
      - run: npm run lint
        working-directory: frontend
      - run: npx prettier --check "src/workbench/**/*.{ts,tsx,css}" src/main-window/workflow-canvas/CanvasBackend.ts
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build:workbench
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  native:
    name: Workbench native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify exact candidate revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.ref || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Validated source revision: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: workbench-${{ matrix.os }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libpipewire-0.3-dev libasound2-dev libgbm-dev libxdo-dev
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - run: cargo fmt --all -- --check
      - run: cargo test -p nuphus-workbench --features gateway
      - run: cargo clippy -p nuphus-workbench --features gateway --all-targets -- -D warnings
      - name: Build local MCP application
        run: node scripts/prepare-workbench-mcp.mjs --debug
      - name: Windows installer MCP lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./src-tauri/installer/test-workbench-mcp.ps1 -McpExecutable target/debug/nuphus-workbench-mcp.exe -TestRoot "${{ runner.temp }}/workbench-mcp-check"
      - run: cargo test -p nuphus --lib workflow --features workbench
      - run: cargo test -p nuphus --lib cache::tool_cache --features workbench
      - name: Upstream path and tool compatibility
        run: |
          cargo test -p nuphus --lib utils::tests:: --features workbench
          cargo test -p nuphus --lib tools::registry::tests:: --features workbench
      - run: cargo check -p nuphus-desktop --features workbench
      - run: cargo test -p nuphus-desktop --features workbench --bin nuphus workbench
      - name: Windows official updater offline installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node --test tools/lingque-release/installer-language.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p nuphus-desktop --features workbench --example lingque-updater-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File src-tauri/installer/tests/run.ps1 -MakeNsis "${env:ProgramFiles(x86)}/NSIS/makensis.exe" -McpExecutable target/debug/nuphus-workbench-mcp.exe -NativeUpdaterProbe target/debug/examples/lingque-updater-probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Handoff migration and edition isolation
        run: cargo test -p nuphus-desktop --features workbench --bin nuphus commands::config::handoff::tests
      - run: cargo check -p nuphus-desktop
      - name: macOS desktop contracts
        if: runner.os == 'macOS'
        run: |
          cargo test -p nuphus --lib desktop_automation:: --features workbench
          cargo test -p nuphus --lib tools::semantic_desktop:: --features workbench
          cargo test -p desktop-api --lib
