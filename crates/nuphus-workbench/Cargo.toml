[package]
name = "nuphus-workbench"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Transport-independent workspace, revision and execution services for Nuphus Workbench"

[[bin]]
name = "nuphus-workbench-mcp"
path = "src/bin/mcp.rs"
required-features = ["gateway"]

[features]
gateway = ["dep:axum", "dep:rmcp", "dep:futures-util", "dep:tokio-stream", "dep:reqwest", "tokio/net", "tokio/time", "tokio/rt-multi-thread"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
axum = { version = "0.7", optional = true }
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "transport-streamable-http-server", "transport-io"], optional = true }
futures-util = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", optional = true }
reqwest = { version = "0.12", features = ["json", "stream"], optional = true }

[dev-dependencies]
tempfile = "3"
